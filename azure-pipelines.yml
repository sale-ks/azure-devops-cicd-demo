trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  pythonVersion: '3.12'

stages:

- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m compileall src
      displayName: 'Compile Python application'

- stage: Test
  displayName: 'Run Tests'
  dependsOn: Build
  jobs:
  - job: TestJob
    steps:
    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        python -m unittest discover -s tests -v
      displayName: 'Run unit tests'

- stage: Publish
  displayName: 'Publish Build Artifact'
  dependsOn: Test
  jobs:
  - job: PublishJob
    steps:
    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)'
        ArtifactName: 'application'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Test Environment'
  dependsOn: Publish
  jobs:
  - job: DeployJob
    steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'current'
        downloadType: 'single'
        artifactName: 'application'
        downloadPath: '$(Pipeline.Workspace)'

    - task: UsePythonVersion@0
      inputs:
        versionSpec: '$(pythonVersion)'

    - script: |
        set -e

        echo "Starting deployment to test environment..."

        mkdir -p "$(Pipeline.Workspace)/test-environment"

        cp -R "$(Pipeline.Workspace)/application/." \
          "$(Pipeline.Workspace)/test-environment/"

        echo "Starting application..."

        APP_OUTPUT=$(python "$(Pipeline.Workspace)/test-environment/src/app.py")

        echo "$APP_OUTPUT"

        echo "$APP_OUTPUT" | grep -q "healthy"

        echo "Deployment verification successful!"
      displayName: 'Deploy and verify application'
